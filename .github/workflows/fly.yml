name: Deploy to Fly.io

# Deploys web/ to Fly whenever this branch is pushed, or on demand.
# One-time setup: add a repository secret named FLY_API_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret).
# The site URL is printed in the run summary when the deploy succeeds.

on:
  push:
    branches: [claude/mazer-mobile-recreation-ecbzsc, master, main]
    paths: [web/**, .github/workflows/fly.yml]
  workflow_dispatch:
    inputs:
      app:
        description: App name (must be unique across all of Fly). The site becomes https://<app>.fly.dev
        default: mazer-game
        required: false

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ inputs.app || 'mazer-game' }}
      REGION: sjc
    steps:
      - uses: actions/checkout@v4

      - name: Check the token is set
        run: |
          N=${#FLY_API_TOKEN}
          echo "FLY_API_TOKEN length: $N characters (a full Fly token is roughly 700-900)"
          if [ "$N" -eq 0 ]; then
            echo "::error::The repository has no Actions secret named FLY_API_TOKEN visible to this run. Check https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions - the name must be exactly FLY_API_TOKEN and it must be listed under 'Repository secrets', not Dependabot or Codespaces."
            exit 1
          fi
          if [ "$N" -lt 200 ]; then
            echo "::error::FLY_API_TOKEN is only $N characters, so it looks truncated. Re-copy the whole token, including the part after the comma."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Test the engine
        run: node web/test/engine.test.js

      - name: Point fly.toml at the app name
        working-directory: web
        run: sed -i "s/^app = .*/app = \"$APP\"/" fly.toml

      - name: Create the app if it doesn't exist
        working-directory: web
        run: |
          if flyctl status -a "$APP" >/dev/null 2>&1; then
            echo "App $APP already exists."
          elif ! flyctl apps create "$APP" 2>err.txt; then
            cat err.txt
            echo "::error::Could not create the app '$APP'. If the name is taken, re-run this workflow from the Actions tab and enter a different app name."
            exit 1
          fi

      - name: Create the data volume if it doesn't exist
        working-directory: web
        run: |
          flyctl volumes list -a "$APP" --json | grep -q mazer_data \
            || flyctl volumes create mazer_data -a "$APP" -r "$REGION" -s 1 -y

      - name: Deploy
        working-directory: web
        run: flyctl deploy --remote-only --ha=false

      - name: Smoke test and report the URL
        run: |
          URL="https://$APP.fly.dev"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$URL/healthz"; then
              echo "" && echo "Mazer is live at $URL"
              echo "## Mazer is live" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "$URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Deployed, but $URL/healthz did not answer. Check 'flyctl logs -a $APP'."
          exit 1
